name: load

# Release qualification (spec §17): two years of synthetic data on both
# databases. Run manually or before tagging a release.
on:
  workflow_dispatch:

jobs:
  load:
    name: Load & aging · ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, mysql]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: tendril
          POSTGRES_USER: tendril
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tendril" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tendril
          MYSQL_USER: tendril
          MYSQL_PASSWORD: ${{ github.run_id }}
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: tendril
      DB_USERNAME: tendril
      DB_PASSWORD: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_mysql, pdo_sqlite
          coverage: none
          ini-values: memory_limit=2G
      - run: composer update --prefer-dist --no-interaction --no-progress
      # --exclude-group overrides phpunit.xml, which excludes "load" by default.
      - run: vendor/bin/pest --group=load --exclude-group=none --colors=always
